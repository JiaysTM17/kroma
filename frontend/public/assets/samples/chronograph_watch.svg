<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="leather-strap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B1C0B" />
      <stop offset="30%" stop-color="#5E2C04" />
      <stop offset="70%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#271004" />
    </linearGradient>
    <linearGradient id="bezel-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="dial-sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="watch-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
  </defs>

  <g transform="translate(300, 100)" filter="url(#watch-shadow)">
    <!-- Top Leather Strap -->
    <path d="M 130 0 L 270 0 L 255 250 L 145 250 Z" fill="url(#leather-strap)" />
    <!-- Top Stitching -->
    <line x1="145" y1="10" x2="155" y2="240" stroke="#CA8A04" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="255" y1="10" x2="245" y2="240" stroke="#CA8A04" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Bottom Leather Strap -->
    <path d="M 145 550 L 255 550 L 270 800 L 130 800 Z" fill="url(#leather-strap)" />
    <!-- Bottom Stitching & Pin Holes -->
    <line x1="155" y1="560" x2="145" y2="790" stroke="#CA8A04" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="245" y1="560" x2="255" y2="790" stroke="#CA8A04" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="200" cy="620" r="5" fill="#1C1917" />
    <circle cx="200" cy="670" r="5" fill="#1C1917" />
    <circle cx="200" cy="720" r="5" fill="#1C1917" />

    <!-- Watch Lugs (Steel) -->
    <path d="M 120 220 L 145 270 L 120 330 Z" fill="url(#bezel-steel)" />
    <path d="M 280 220 L 255 270 L 280 330 Z" fill="url(#bezel-steel)" />
    <path d="M 120 470 L 145 530 L 120 580 Z" fill="url(#bezel-steel)" />
    <path d="M 280 470 L 255 530 L 280 580 Z" fill="url(#bezel-steel)" />

    <!-- Watch Case / Outer Bezel -->
    <circle cx="200" cy="400" r="180" fill="url(#bezel-steel)" />
    <circle cx="200" cy="400" r="165" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />

    <!-- Inner Dial -->
    <circle cx="200" cy="400" r="155" fill="url(#dial-sunburst)" />

    <!-- Crown and Pushers on the right -->
    <rect x="375" y="385" width="22" height="30" rx="3" fill="url(#bezel-steel)" />
    <rect x="365" y="325" width="18" height="20" rx="2" fill="url(#bezel-steel)" />
    <rect x="365" y="455" width="18" height="20" rx="2" fill="url(#bezel-steel)" />

    <!-- Chronograph Sub-dials -->
    <circle cx="200" cy="340" r="32" fill="#020617" stroke="#475569" stroke-width="1.5" />
    <circle cx="150" cy="430" r="32" fill="#020617" stroke="#475569" stroke-width="1.5" />
    <circle cx="250" cy="430" r="32" fill="#020617" stroke="#475569" stroke-width="1.5" />

    <!-- Hour Marker Batons -->
    <line x1="200" y1="255" x2="200" y2="275" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="525" x2="200" y2="545" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="400" x2="80" y2="400" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <line x1="320" y1="400" x2="340" y2="400" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />

    <!-- Watch Hands -->
    <!-- Hour Hand -->
    <polygon points="196,400 200,310 204,400 200,415" fill="#F8FAFC" />
    <!-- Minute Hand -->
    <polygon points="197,400 200,270 203,400 200,420" fill="#F8FAFC" />
    <!-- Seconds Hand (Electric Cyan) -->
    <line x1="200" y1="435" x2="200" y2="260" stroke="#06B6D4" stroke-width="2" />
    <circle cx="200" cy="400" r="6" fill="#06B6D4" />

    <!-- Sapphire Crystal Glare Arc -->
    <path d="M 80 340 A 155 155 0 0 1 280 260" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  </g>
</svg>
