<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="amber-bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="25%" stop-color="#B45309" />
      <stop offset="70%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="gold-collar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <filter id="serum-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#451A03" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(350, 160)" filter="url(#serum-shadow)">
    <!-- Amber Glass Body -->
    <rect x="50" y="260" width="200" height="420" rx="28" fill="url(#amber-bottle)" />
    
    <!-- Glass Specular Reflection Ribbon -->
    <path d="M 68 280 L 68 660" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.65" />
    <path d="M 82 290 L 82 650" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />

    <!-- Minimalist Cosmetic Serum Label -->
    <rect x="75" y="380" width="150" height="200" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="150" y="420" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#0F172A" text-anchor="middle">
      KROMA
    </text>
    <text x="150" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#4F46E5" text-anchor="middle">
      HYALURONIC B5
    </text>
    <line x1="100" y1="460" x2="200" y2="460" stroke="#CBD5E1" stroke-width="1" />
    <text x="150" y="485" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">
      DEEP HYDRATING SERUM
    </text>
    <text x="150" y="540" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">
      30 ML / 1.0 FL. OZ.
    </text>

    <!-- Bottle Neck -->
    <rect x="110" y="210" width="80" height="55" rx="4" fill="url(#amber-bottle)" />

    <!-- Gold Metallic Pipette Collar -->
    <rect x="95" y="150" width="110" height="65" rx="8" fill="url(#gold-collar)" stroke="#78350F" stroke-width="1" />
    <line x1="95" y1="180" x2="205" y2="180" stroke="#78350F" stroke-width="1" />

    <!-- Rubber Dropper Bulb (Matte Black) -->
    <path d="M 115 150 C 110 90 125 50 150 50 C 175 50 190 90 185 150 Z" fill="#18181B" stroke="#09090B" stroke-width="1" />
    <!-- Dropper Bulb Highlight -->
    <path d="M 130 140 C 128 100 138 70 150 70" stroke="#52525B" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
