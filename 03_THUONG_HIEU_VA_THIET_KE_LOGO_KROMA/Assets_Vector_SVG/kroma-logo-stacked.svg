<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kroma-s-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="kroma-s-arm-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="kroma-s-arm-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="kroma-s-prism-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <filter id="kroma-s-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Centered Icon Mark -->
  <g transform="translate(176, 70)" filter="url(#kroma-s-shadow)">
    <!-- Vertical Pillar -->
    <path d="M 24 16 C 24 7.16 31.16 0 40 0 L 52 0 C 60.84 0 68 7.16 68 16 L 68 144 C 68 152.84 60.84 160 52 160 L 40 160 C 31.16 160 24 152.84 24 144 Z" 
          fill="url(#kroma-s-stem)" />

    <!-- Upper Chromatic Beam -->
    <path d="M 72 74 C 70 70 73 64 78 61 L 138 22 C 145 18 154 23 154 31 L 154 44 C 154 50 150 56 144 60 L 92 94 C 85 98 76 94 74 86 Z" 
          fill="url(#kroma-s-arm-top)" />

    <!-- Lower Precision Beam -->
    <path d="M 74 76 C 76 68 85 64 92 68 L 144 102 C 150 106 154 112 154 118 L 154 131 C 154 139 145 144 138 140 L 78 101 C 73 98 70 92 72 88 Z" 
          fill="url(#kroma-s-arm-bottom)" />

    <!-- Chromatic Prism Center -->
    <path d="M 68 62 L 96 81 L 68 100 Z" 
          fill="url(#kroma-s-prism-core)" 
          opacity="0.95" />
          
    <circle cx="96" cy="81" r="5" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Centered Typography KROMA (Precision Optical Kerning - Cohesive Unified Letterforms) -->
  <g transform="translate(250, 340)">
    <!-- Group centered at x=0 (Width=410, offset=-205) -->
    <g transform="translate(-205, 0)">
      <!-- K (0 -> 70) -->
      <path d="M 0 10 L 0 -68 L 16 -68 L 16 -37 L 46 -68 L 68 -68 L 31 -30 L 70 10 L 48 10 L 16 -23 L 16 10 Z" fill="#0F172A" />

      <!-- R (76 -> 144) -->
      <path d="M 76 10 L 76 -68 L 112 -68 C 131 -68 142 -58 142 -43 C 142 -31 134 -23 122 -20 L 146 10 L 125 10 L 104 -18 L 92 -18 L 92 10 Z M 92 -32 L 110 -32 C 120 -32 126 -37 126 -43 C 126 -50 120 -54 110 -54 L 92 -54 Z" fill="#0F172A" />

      <!-- O (150 -> 226) -->
      <path d="M 188 -68 C 209.0 -68 226 -50.5 226 -29 C 226 -7.5 209.0 10 188 10 C 167.0 10 150 -7.5 150 -29 C 150 -50.5 167.0 -68 188 -68 Z M 188 -53 C 175.3 -53 165 -42.3 165 -29 C 165 -15.7 175.3 -5 188 -5 C 200.7 -5 211 -15.7 211 -29 C 211 -42.3 200.7 -53 188 -53 Z" fill="#0F172A" />

      <!-- M (232 -> 312, seamless tuck into O curve) -->
      <path d="M 232 10 L 232 -68 L 251 -68 L 272 -20 L 293 -68 L 312 -68 L 312 10 L 296 10 L 296 -40 L 279 0 L 265 0 L 248 -40 L 248 10 Z" fill="#0F172A" />

      <!-- A (318 -> 399, optical apex align) -->
      <path d="M 381 10 L 373 -10 L 343 -10 L 335 10 L 318 10 L 350 -68 L 367 -68 L 399 10 Z M 358 -48 L 348 -24 L 368 -24 Z" fill="#0F172A" />

      <!-- Dot Accent -->
      <circle cx="405" cy="-60" r="4.5" fill="#06B6D4" />
    </g>
  </g>

  <!-- Subtitle -->
  <text x="250" y="385" 
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#64748B">
    INTELLIGENT IMAGE STUDIO
  </text>
</svg>
